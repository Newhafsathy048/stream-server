worker_processes auto;
error_log /dev/stdout info;

events {
    worker_connections 1024;
    accept_mutex off;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Ingest ya moja kwa moja kutoka OBS / FFmpeg:
        #   rtmp://SERVER_YAKO:1935/live/STREAM_KEY
        application live {
            live on;
            record off;

            # Ruhusu kutuma tu kutoka kwa mtandao wa ndani / kwa stream key sahihi.
            allow publish all;
            allow play all;

            # Transcode (360p/480p) inafanywa na container ya `transcoder`,
            # ambayo huchukua stream hapa na kuipeleka kwenye application ya `hls`.
        }

        # Application hii inatengeneza HLS pekee (haifanyi transcode tena).
        application hls {
            live on;
            record off;
            # Ruhusu transcoder pekee (mtandao wa ndani wa docker).
            allow publish 127.0.0.1;
            allow publish 172.16.0.0/12;
            deny publish all;

            hls on;
            hls_path /tmp/hls;
            hls_fragment 2s;
            hls_playlist_length 12s;
            hls_nested on;
            hls_cleanup on;

            # ABR: playlist moja yenye 360p na 480p
            hls_variant _360p BANDWIDTH=900000,RESOLUTION=640x360;
            hls_variant _480p BANDWIDTH=1600000,RESOLUTION=854x480;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;

        # Player wa browser
        location / {
            root /www/static;
            index index.html;
            add_header Cache-Control "no-cache";
        }

        # HLS (inacheza kwenye browser yoyote kupitia hls.js / Safari native)
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;

            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range";
        }

        # Takwimu za RTMP
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet /stat.xsl;
        }
        location /stat.xsl {
            root /www/static;
        }

        location /health {
            return 200 "ok\n";
        }
    }
}

<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Stream Player</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
  .wrap { width: 100%; max-width: 960px; }
  .player-box { position: relative; background: #000; border-radius: 10px; overflow: hidden; }
  video { width: 100%; display: block; aspect-ratio: 16 / 9; background: #000; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  input[type=text] {
    flex: 1 1 320px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid #30363d; background: #161b22; color: #e6edf3; font-size: 14px;
  }
  button, select {
    padding: 9px 14px; border-radius: 8px; border: 1px solid #30363d;
    background: #21262d; color: #e6edf3; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #30363d; }
  #status { margin-top: 10px; font-size: 13px; color: #8b949e; min-height: 18px; }
  #status.error { color: #f85149; }
  #status.live { color: #3fb950; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Live Stream Player</h1>
    <div class="player-box">
      <video id="video" controls autoplay muted playsinline></video>
    </div>
    <div class="controls">
      <input id="src" type="text" value="/hls/stream.m3u8" spellcheck="false" />
      <select id="quality" title="Ubora"><option value="-1">Auto</option></select>
      <button id="load">Cheza</button>
    </div>
    <p id="status">Tayari.</p>
  </div>

  <script src="/vendor/hls.min.js"></script>
  <script>
    const video = document.getElementById('video');
    const srcInput = document.getElementById('src');
    const qualitySel = document.getElementById('quality');
    const statusEl = document.getElementById('status');
    let hls = null;

    function setStatus(text, cls = '') {
      statusEl.textContent = text;
      statusEl.className = cls;
    }

    function resetQualities() {
      qualitySel.innerHTML = '<option value="-1">Auto</option>';
    }

    function load() {
      const url = srcInput.value.trim();
      if (!url) return;
      resetQualities();

      if (hls) { hls.destroy(); hls = null; }

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ lowLatencyMode: true, liveSyncDurationCount: 3 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, (_e, data) => {
          setStatus('Inacheza (LIVE)', 'live');
          data.levels.forEach((lvl, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = (lvl.height ? lvl.height + 'p' : 'level ' + i) +
              (lvl.bitrate ? ' — ' + Math.round(lvl.bitrate / 1000) + 'kbps' : '');
            qualitySel.appendChild(opt);
          });
          video.play().catch(() => setStatus('Bonyeza play kuanza.', ''));
        });
        hls.on(Hls.Events.ERROR, (_e, data) => {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            setStatus('Hitilafu ya mtandao — inajaribu tena...', 'error');
            hls.startLoad();
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            setStatus('Hitilafu ya media — inarekebisha...', 'error');
            hls.recoverMediaError();
          } else {
            setStatus('Imeshindwa kucheza: ' + data.details, 'error');
            hls.destroy();
            hls = null;
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari / iOS: HLS ya asili
        video.src = url;
        video.addEventListener('loadedmetadata', () => setStatus('Inacheza (LIVE)', 'live'), { once: true });
        video.play().catch(() => setStatus('Bonyeza play kuanza.', ''));
      } else {
        setStatus('Browser hii haiungi mkono HLS.', 'error');
      }
    }

    qualitySel.addEventListener('change', () => {
      if (hls) hls.currentLevel = parseInt(qualitySel.value, 10);
    });
    document.getElementById('load').addEventListener('click', load);
    srcInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });

    const qs = new URLSearchParams(location.search).get('src');
    if (qs) srcInput.value = qs;
    load();
  </script>
</body>
</html>

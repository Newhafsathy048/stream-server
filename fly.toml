# fly.toml app configuration file generated for stream-server on 2026-08-15T16:47:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'stream-server'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 1935
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
